<svg viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#27187E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#030312;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1152;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#0a0620;stop-opacity:0.95" />
    </linearGradient>
    
    <linearGradient id="buttonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#758BFD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BEADFF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main background -->
  <rect width="390" height="844" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="50" cy="700" r="80" fill="#758BFD" opacity="0.03"/>
  <circle cx="340" cy="200" r="100" fill="#BEADFF" opacity="0.04"/>
  
  <!-- Top bar -->
  <rect width="390" height="60" fill="#030312" opacity="0.95"/>
  <text x="20" y="28" font-family="Arial, sans-serif" font-size="14" fill="#758BFD">Sígale</text>
  <text x="20" y="48" font-family="Arial, sans-serif" font-size="14" fill="#BEADFF">Prueba 2</text>
  
  <!-- Icons placeholder (top right) -->
  <rect x="260" y="18" width="24" height="24" rx="4" fill="#FF8C00" opacity="0.3"/>
  <rect x="290" y="18" width="24" height="24" rx="4" fill="#FF8C00" opacity="0.3"/>
  <rect x="320" y="18" width="24" height="24" rx="4" fill="#FF8C00" opacity="0.3"/>
  
  <!-- Burger menu icon -->
  <rect x="345" y="22" width="24" height="2" rx="1" fill="#BEADFF"/>
  <rect x="345" y="29" width="24" height="2" rx="1" fill="#BEADFF"/>
  <rect x="345" y="36" width="24" height="2" rx="1" fill="#BEADFF"/>
  
  <!-- Main content area -->
  <rect x="20" y="90" width="350" height="720" rx="24" fill="url(#cardGradient)"/>
  <rect x="20" y="90" width="350" height="720" rx="24" fill="none" stroke="#758BFD" stroke-width="1" opacity="0.2"/>
  
  <!-- Page title -->
  <text x="40" y="130" font-size="20" fill="#FF8C00">🎫</text>
  <text x="70" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFEDD8">Validación de Registro</text>
  
  <!-- Subtitle -->
  <text x="40" y="160" font-family="Arial, sans-serif" font-size="13" fill="#BEADFF" opacity="0.8">Escanear códigos QR para validar y registrar asistentes</text>
  
  <!-- Tab buttons -->
  <rect x="40" y="185" width="140" height="40" rx="8" fill="#4a3d8f"/>
  <rect x="40" y="185" width="140" height="40" rx="8" fill="none" stroke="#758BFD" stroke-width="1" opacity="0.5"/>
  <text x="110" y="211" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFEDD8" text-anchor="middle">📷 Escáner</text>
  
  <rect x="190" y="185" width="160" height="40" rx="8" fill="#2a2a2a"/>
  <rect x="190" y="185" width="160" height="40" rx="8" fill="none" stroke="#758BFD" stroke-width="1" opacity="0.3"/>
  <text x="270" y="211" font-family="Arial, sans-serif" font-size="14" fill="#BEADFF" text-anchor="middle">📋 Lista de Boletas</text>
  
  <!-- Search bar -->
  <rect x="40" y="245" width="310" height="42" rx="8" fill="#2a2a2a"/>
  <rect x="40" y="245" width="310" height="42" rx="8" fill="none" stroke="#758BFD" stroke-width="1" opacity="0.3"/>
  <text x="52" y="271" font-family="Arial, sans-serif" font-size="13" fill="#BEADFF" opacity="0.5">🔍 Search by name, ID, phone, or ticket number...</text>
  
  <!-- Search result count -->
  <text x="40" y="310" font-family="Arial, sans-serif" font-size="13" fill="#4ade80">1ticket found</text>
  <text x="120" y="310" font-family="Arial, sans-serif" font-size="13" fill="#758BFD">0checked in</text>
  
  <!-- Ticket card -->
  <rect x="40" y="330" width="310" height="220" rx="12" fill="#2a2a2a"/>
  <rect x="40" y="330" width="310" height="220" rx="12" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.5"/>
  
  <!-- Checkmark badge -->
  <circle cx="320" cy="350" r="16" fill="#4ade80"/>
  <text x="320" y="357" font-size="18" fill="#000000" text-anchor="middle" font-weight="bold">✓</text>
  
  <!-- Name -->
  <text x="55" y="365" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFEDD8">David Ram</text>
  
  <!-- Ticket ID -->
  <text x="55" y="390" font-family="monospace" font-size="12" fill="#758BFD">TKT-318-1759962930490</text>
  
  <!-- Divider -->
  <line x1="55" y1="405" x2="335" y2="405" stroke="#758BFD" stroke-width="1" opacity="0.3"/>
  
  <!-- Details grid -->
  <text x="55" y="430" font-family="Arial, sans-serif" font-size="12" fill="#BEADFF" opacity="0.7">Ticket Type</text>
  <text x="220" y="430" font-family="Arial, sans-serif" font-size="12" fill="#BEADFF" opacity="0.7">Price</text>
  
  <text x="55" y="450" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFEDD8">Preventa</text>
  <text x="220" y="450" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFEDD8">$25.000</text>
  
  <text x="55" y="480" font-family="Arial, sans-serif" font-size="12" fill="#BEADFF" opacity="0.7">ID Number</text>
  <text x="220" y="480" font-family="Arial, sans-serif" font-size="12" fill="#BEADFF" opacity="0.7">Phone</text>
  
  <text x="55" y="500" font-family="Arial, sans-serif" font-size="14" fill="#FFEDD8">1010241962</text>
  <text x="220" y="500" font-family="Arial, sans-serif" font-size="14" fill="#FFEDD8">3212619103</text>
  
  <!-- Purchase date -->
  <text x="55" y="525" font-family="Arial, sans-serif" font-size="12" fill="#BEADFF" opacity="0.7">Purchase Date</text>
  <text x="55" y="545" font-family="Arial, sans-serif" font-size="14" fill="#FFEDD8">Oct 7, 2025</text>
  
  <!-- Show QR button -->
  <rect x="55" y="565" width="280" height="40" rx="8" fill="#4a3d8f"/>
  <rect x="55" y="565" width="280" height="40" rx="8" fill="none" stroke="#758BFD" stroke-width="1" opacity="0.3"/>
  <text x="195" y="590" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFEDD8" text-anchor="middle">Show QR Code</text>
</svg>