<svg viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#27187E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#030312;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1152;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#0a0620;stop-opacity:0.95" />
    </linearGradient>
    
    <linearGradient id="buttonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#758BFD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BEADFF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Wave pattern for background -->
    <path id="wave" d="M0,50 Q97.5,20 195,50 T390,50 V0 H0 Z" fill="#758BFD" opacity="0.1"/>
  </defs>
  
  <!-- Main background -->
  <rect width="390" height="844" fill="url(#bgGradient)"/>
  
  <!-- Decorative waves -->
  <use href="#wave" y="600" opacity="0.08"/>
  <use href="#wave" y="700" opacity="0.05"/>
  
  <!-- Decorative circles -->
  <circle cx="50" cy="750" r="80" fill="#758BFD" opacity="0.03"/>
  <circle cx="340" cy="200" r="100" fill="#BEADFF" opacity="0.04"/>
  
  <!-- Top bar -->
  <rect width="390" height="60" fill="#030312" opacity="0.95"/>
  <text x="20" y="38" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#BEADFF">Sígale</text>
  
  <!-- Burger menu icon -->
  <rect x="345" y="22" width="24" height="2" rx="1" fill="#BEADFF"/>
  <rect x="345" y="29" width="24" height="2" rx="1" fill="#BEADFF"/>
  <rect x="345" y="36" width="24" height="2" rx="1" fill="#BEADFF"/>
  
  <!-- Main card container -->
  <rect x="20" y="90" width="350" height="700" rx="24" fill="url(#cardGradient)"/>
  
  <!-- Subtle border glow -->
  <rect x="20" y="90" width="350" height="700" rx="24" fill="none" stroke="#758BFD" stroke-width="1" opacity="0.2"/>
  
  <!-- Title section with icon -->
  <circle cx="50" cy="125" r="18" fill="#758BFD" opacity="0.3"/>
  <text x="45" y="133" font-size="20">✨</text>
  <text x="80" y="133" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFEDD8">Crear Nuevo Evento</text>
  <text x="40" y="158" font-family="Arial, sans-serif" font-size="13" fill="#BEADFF" opacity="0.8">Configure los detalles de su evento y tipos de boletas</text>
  
  <!-- Event Details Section -->
  <text x="40" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FF8C00">📋 DETALLES DEL EVENTO</text>
  
  <!-- Event Name -->
  <text x="40" y="225" font-family="Arial, sans-serif" font-size="12" fill="#FFEDD8">🎪 Nombre del Evento</text>
  <rect x="40" y="232" width="310" height="42" rx="8" fill="#4a3d8f"/>
  <rect x="40" y="232" width="310" height="42" rx="8" fill="none" stroke="#758BFD" stroke-width="1" opacity="0.3"/>
  <text x="52" y="258" font-family="Arial, sans-serif" font-size="14" fill="#FFEDD8">Festival de Rock de Verano 2025</text>
  
  <!-- Date -->
  <text x="40" y="295" font-family="Arial, sans-serif" font-size="12" fill="#FFEDD8">📅 Fecha</text>
  <rect x="40" y="302" width="150" height="42" rx="8" fill="#4a3d8f"/>
  <rect x="40" y="302" width="150" height="42" rx="8" fill="none" stroke="#758BFD" stroke-width="1" opacity="0.3"/>
  <text x="52" y="328" font-family="Arial, sans-serif" font-size="14" fill="#BEADFF" opacity="0.6">dd/mm/aaaa</text>
  <text x="170" y="328" font-family="Arial, sans-serif" font-size="18" fill="#FF8C00">📆</text>
  
  <!-- Time -->
  <text x="200" y="295" font-family="Arial, sans-serif" font-size="12" fill="#FFEDD8">🕐 Hora de Entrada</text>
  <rect x="200" y="302" width="150" height="42" rx="8" fill="#4a3d8f"/>
  <rect x="200" y="302" width="150" height="42" rx="8" fill="none" stroke="#758BFD" stroke-width="1" opacity="0.3"/>
  <text x="212" y="328" font-family="Arial, sans-serif" font-size="14" fill="#BEADFF" opacity="0.6">--:-- -----</text>
  <text x="330" y="328" font-family="Arial, sans-serif" font-size="18" fill="#FF8C00">🕒</text>
  
  <!-- Venue Name -->
  <text x="40" y="365" font-family="Arial, sans-serif" font-size="12" fill="#FFEDD8">📍 Nombre del Lugar</text>
  <rect x="40" y="372" width="310" height="42" rx="8" fill="#4a3d8f"/>
  <rect x="40" y="372" width="310" height="42" rx="8" fill="none" stroke="#758BFD" stroke-width="1" opacity="0.3"/>
  <text x="52" y="398" font-family="Arial, sans-serif" font-size="14" fill="#FFEDD8">Estadio Nacional</text>
  
  <!-- Full Address -->
  <text x="40" y="435" font-family="Arial, sans-serif" font-size="12" fill="#FFEDD8">🗺️ Dirección Completa</text>
  <rect x="40" y="442" width="310" height="42" rx="8" fill="#4a3d8f"/>
  <rect x="40" y="442" width="310" height="42" rx="8" fill="none" stroke="#758BFD" stroke-width="1" opacity="0.3"/>
  <text x="52" y="468" font-family="Arial, sans-serif" font-size="13" fill="#BEADFF" opacity="0.7">Calle 123, Ciudad, Estado, Código Postal</text>
  
  <!-- Color Theme Section -->
  <text x="40" y="510" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FF8C00">🎨 TEMA DE COLOR</text>
  
  <!-- Base Color (Left) -->
  <text x="40" y="535" font-family="Arial, sans-serif" font-size="12" fill="#FFEDD8">Color Base</text>
  <rect x="40" y="542" width="150" height="42" rx="8" fill="#4a3d8f"/>
  <rect x="40" y="542" width="150" height="42" rx="8" fill="none" stroke="#758BFD" stroke-width="1" opacity="0.3"/>
  <rect x="52" y="554" width="24" height="18" rx="3" fill="#030312"/>
  <rect x="52" y="554" width="24" height="18" rx="3" fill="none" stroke="#758BFD" stroke-width="1" opacity="0.5"/>
  <text x="85" y="568" font-family="monospace" font-size="11" fill="#FFEDD8">#030312</text>
  
  <!-- Accent Color (Right) -->
  <text x="200" y="535" font-family="Arial, sans-serif" font-size="12" fill="#FFEDD8">Color de Acento</text>
  <rect x="200" y="542" width="150" height="42" rx="8" fill="#4a3d8f"/>
  <rect x="200" y="542" width="150" height="42" rx="8" fill="none" stroke="#758BFD" stroke-width="1" opacity="0.3"/>
  <rect x="212" y="554" width="24" height="18" rx="3" fill="#758BFD"/>
  <rect x="212" y="554" width="24" height="18" rx="3" fill="none" stroke="#BEADFF" stroke-width="1" opacity="0.5"/>
  <text x="245" y="568" font-family="monospace" font-size="11" fill="#FFEDD8">#758BFD</text>
  
  <!-- Helper text below both colors -->
  <text x="40" y="600" font-family="Arial, sans-serif" font-size="11" fill="#BEADFF" opacity="0.6">Usado para la barra de navegación</text>
  <text x="200" y="600" font-family="Arial, sans-serif" font-size="11" fill="#BEADFF" opacity="0.6">Usado para resaltes y acentos</text>
  
  <!-- Ticket Types Section -->
  <text x="40" y="635" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FF8C00">🎫 TIPOS DE BOLETAS</text>
  
  <!-- Action Button -->
  <rect x="40" y="660" width="310" height="50" rx="12" fill="url(#buttonGradient)"/>
  <rect x="40" y="660" width="310" height="50" rx="12" fill="none" stroke="#BEADFF" stroke-width="1" opacity="0.3"/>
  <text x="195" y="690" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFEDD8" text-anchor="middle">Continuar</text>
  
  <!-- Bottom decorative element -->
  <circle cx="195" cy="735" r="3" fill="#758BFD" opacity="0.4"/>
  <circle cx="210" cy="735" r="3" fill="#BEADFF" opacity="0.6"/>
  <circle cx="180" cy="735" r="3" fill="#FF8C00" opacity="0.5"/>
</svg>