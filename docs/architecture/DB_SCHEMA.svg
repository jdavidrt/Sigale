<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 820" width="1080" height="820" role="img" aria-label="Entity-relationship diagram of the sigale MySQL database after migrations 010 through 013: eight tables; organizer_events is new, organizers gains role and isActive, tickets gains preferredArtist, and events gains isArchived and scanKeyword.">
  <style>
    svg { --bg:#F6F1F3; --surface:#FFFFFF; --ink:#1B1320; --muted:#6B5E70; --dim:#9A8FA0; --frame:#CBB7DA; --hair:#E5DCEA; --accent:#A46F0F; --accent-fill:rgba(231,174,63,0.16); --edge:#8B4A91; --edge-text:#6E3A73; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#09060A; --surface:#120C14; --ink:#F3E8D6; --muted:rgba(243,232,214,0.62); --dim:rgba(243,232,214,0.36); --frame:rgba(203,183,218,0.42); --hair:rgba(243,232,214,0.10); --accent:#E7AE3F; --accent-fill:rgba(231,174,63,0.12); --edge:#CBB7DA; --edge-text:#CBB7DA; }
    }
    .diagram { font-family: "Barlow Semi Condensed", "Segoe UI", system-ui, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .bg { fill: var(--bg); }
    .ttl { font-size: 12px; font-weight: 500; fill: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
    .box { fill: var(--surface); stroke: var(--frame); stroke-width: 1; }
    .box-new { fill: var(--accent-fill); stroke: var(--accent); stroke-width: 1.5; }
    .box-dim { fill: var(--surface); stroke: var(--frame); stroke-width: 1; stroke-dasharray: 4 3; opacity: 0.8; }
    .hd { stroke: var(--hair); stroke-width: 1; }
    .hdr { font-size: 13px; font-weight: 700; fill: var(--ink); }
    .hdr-new { fill: var(--accent); }
    .tag { font-size: 9.5px; font-weight: 500; fill: var(--muted); text-anchor: end; }
    .tag-new { fill: var(--accent); }
    .k { font-size: 9px; font-weight: 700; fill: var(--muted); }
    .k-new { fill: var(--accent); }
    .c { font-size: 11.5px; fill: var(--ink); }
    .c-new { fill: var(--accent); font-weight: 700; }
    .c-ret { fill: var(--dim); }
    .t { font-size: 10.5px; fill: var(--muted); text-anchor: end; }
    .t-new { fill: var(--accent); opacity: 0.85; }
    .t-ret { fill: var(--dim); }
    .note { font-size: 10.5px; font-style: italic; fill: var(--accent); }
    .edge { fill: none; stroke: var(--edge); stroke-width: 1.4; }
    .edge-new { stroke: var(--accent); }
    .lbl { font-size: 10px; font-weight: 500; fill: var(--edge-text); }
    .lbl-new { fill: var(--accent); }
    .lbl2 { font-size: 9.5px; fill: var(--muted); }
    .lg { font-size: 10px; fill: var(--ink); }
    .lg-t { font-size: 11px; font-weight: 600; fill: var(--ink); letter-spacing: 0.04em; }
    .mk { fill: var(--edge); stroke: var(--edge); }
    .mk-new { fill: var(--accent); stroke: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path class="mk" d="M0,1 L9,5 L0,9 Z" stroke="none"/></marker>
    <marker id="arrow-new" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path class="mk-new" d="M0,1 L9,5 L0,9 Z" stroke="none"/></marker>
    <marker id="crow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto-start-reverse"><path class="mk" d="M0,6 L10,1 M0,6 L10,6 M0,6 L10,11" fill="none" stroke-width="1.4"/></marker>
    <marker id="crow-new" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto-start-reverse"><path class="mk-new" d="M0,6 L10,1 M0,6 L10,6 M0,6 L10,11" fill="none" stroke-width="1.4"/></marker>
  </defs>
  <g class="diagram">
  <rect class="bg" x="0" y="0" width="1080" height="820"/>
  <text class="ttl" x="20" y="28">sigale · schema after migrations 010–013 · additions in daffodil</text>

  <!-- ─── organizers (col A) ─── -->
  <rect class="box" x="20" y="48" width="300" height="157" rx="6"/>
  <text class="hdr mono" x="32" y="67">organizers</text>
  <text class="tag" x="308" y="66">existing · +2 columns in 010</text>
  <line class="hd" x1="20" y1="76" x2="320" y2="76"/>
  <text class="mono" y="92"><tspan class="k" x="30">PK</tspan><tspan class="c" x="64">id</tspan><tspan class="t" x="310">BIGINT UNSIGNED · AI</tspan></text>
  <text class="mono" y="109"><tspan class="k" x="30">UQ</tspan><tspan class="c" x="64">username</tspan><tspan class="t" x="310">VARCHAR(80)</tspan></text>
  <text class="mono" y="126"><tspan class="k k-new" x="30">+</tspan><tspan class="c c-new" x="64">role</tspan><tspan class="t t-new" x="310">ENUM(super_admin, event_admin)</tspan></text>
  <text class="mono" y="143"><tspan class="k k-new" x="30">+</tspan><tspan class="c c-new" x="64">isActive</tspan><tspan class="t t-new" x="310">TINYINT(1)</tspan></text>
  <text class="mono" y="160"><tspan class="c" x="64">passwordHash</tspan><tspan class="t" x="310">VARCHAR(255) · bcrypt</tspan></text>
  <text class="mono" y="177"><tspan class="c" x="64">createdAt</tspan><tspan class="t" x="310">TIMESTAMP</tspan></text>
  <text class="note" x="30" y="194">role defaults to event_admin · isActive to 1</text>

  <!-- ─── organizer_events (col A, NEW) ─── -->
  <rect class="box-new" x="20" y="265" width="300" height="106" rx="6"/>
  <text class="hdr hdr-new mono" x="32" y="284">organizer_events</text>
  <text class="tag tag-new" x="308" y="283">NEW in 010 · join table</text>
  <line class="hd" x1="20" y1="293" x2="320" y2="293"/>
  <text class="mono" y="309"><tspan class="k k-new" x="30">PK FK</tspan><tspan class="c c-new" x="64">organizerId</tspan><tspan class="t t-new" x="310">BIGINT UNSIGNED</tspan></text>
  <text class="mono" y="326"><tspan class="k k-new" x="30">PK FK</tspan><tspan class="c c-new" x="64">eventId</tspan><tspan class="t t-new" x="310">BIGINT UNSIGNED</tspan></text>
  <text class="mono" y="343"><tspan class="c c-new" x="64">createdAt</tspan><tspan class="t t-new" x="310">TIMESTAMP</tspan></text>
  <text class="note" x="30" y="360">event_admin: grants access · super_admin: attribution only</text>

  <!-- ─── guest_passes (col A) ─── -->
  <rect class="box" x="20" y="430" width="300" height="157" rx="6"/>
  <text class="hdr mono" x="32" y="449">guest_passes</text>
  <text class="tag" x="308" y="448">existing · free-entry roster</text>
  <line class="hd" x1="20" y1="458" x2="320" y2="458"/>
  <text class="mono" y="474"><tspan class="k" x="30">PK</tspan><tspan class="c" x="64">id</tspan><tspan class="t" x="310">BIGINT UNSIGNED · AI</tspan></text>
  <text class="mono" y="491"><tspan class="k" x="30">FK</tspan><tspan class="c" x="64">eventId</tspan><tspan class="t" x="310">BIGINT UNSIGNED</tspan></text>
  <text class="mono" y="508"><tspan class="c" x="64">band</tspan><tspan class="t" x="310">VARCHAR(160)</tspan></text>
  <text class="mono" y="525"><tspan class="c" x="64">holderName</tspan><tspan class="t" x="310">VARCHAR(160)</tspan></text>
  <text class="mono" y="542"><tspan class="c" x="64">holderIdNumber</tspan><tspan class="t" x="310">VARCHAR(40)</tspan></text>
  <text class="mono" y="559"><tspan class="c" x="64">type</tspan><tspan class="t" x="310">ENUM(artist, crew, courtesy)</tspan></text>
  <text class="mono" y="576"><tspan class="c" x="64">createdAt</tspan><tspan class="t" x="310">TIMESTAMP</tspan></text>

  <!-- ─── order_counter (col A) ─── -->
  <rect class="box" x="20" y="625" width="300" height="72" rx="6"/>
  <text class="hdr mono" x="32" y="644">order_counter</text>
  <text class="tag" x="308" y="643">existing · orderId floor, one row</text>
  <line class="hd" x1="20" y1="653" x2="320" y2="653"/>
  <text class="mono" y="669"><tspan class="k" x="30">PK</tspan><tspan class="c" x="64">id</tspan><tspan class="t" x="310">TINYINT UNSIGNED</tspan></text>
  <text class="mono" y="686"><tspan class="c" x="64">highWaterMark</tspan><tspan class="t" x="310">INT UNSIGNED</tspan></text>

  <!-- ─── schema_migrations (col A, infra) ─── -->
  <rect class="box-dim" x="20" y="725" width="300" height="72" rx="6"/>
  <text class="hdr mono" x="32" y="744">schema_migrations</text>
  <text class="tag" x="308" y="743">runner ledger · not domain data</text>
  <line class="hd" x1="20" y1="753" x2="320" y2="753"/>
  <text class="mono" y="769"><tspan class="k" x="30">PK</tspan><tspan class="c" x="64">filename</tspan><tspan class="t" x="310">VARCHAR(255)</tspan></text>
  <text class="mono" y="786"><tspan class="c" x="64">appliedAt</tspan><tspan class="t" x="310">TIMESTAMP</tspan></text>

  <!-- ─── events (col B) ─── -->
  <rect class="box" x="390" y="48" width="300" height="378" rx="6"/>
  <text class="hdr mono" x="402" y="67">events</text>
  <text class="tag" x="678" y="66">existing · +2 columns in 012/013 · one row per event</text>
  <line class="hd" x1="390" y1="76" x2="690" y2="76"/>
  <text class="mono" y="92"><tspan class="k" x="400">PK</tspan><tspan class="c" x="434">id</tspan><tspan class="t" x="680">BIGINT UNSIGNED · AI</tspan></text>
  <text class="mono" y="109"><tspan class="k" x="400">UQ</tspan><tspan class="c" x="434">slug</tspan><tspan class="t" x="680">VARCHAR(80) NULL</tspan></text>
  <text class="mono" y="126"><tspan class="c" x="434">name</tspan><tspan class="t" x="680">VARCHAR(160)</tspan></text>
  <text class="mono" y="143"><tspan class="c" x="434">description</tspan><tspan class="t" x="680">TEXT NULL</tspan></text>
  <text class="mono" y="160"><tspan class="c" x="434">artists</tspan><tspan class="t" x="680">JSON · line-up</tspan></text>
  <text class="mono" y="177"><tspan class="c" x="434">eventDate</tspan><tspan class="t" x="680">DATETIME · UTC</tspan></text>
  <text class="mono" y="194"><tspan class="c" x="434">openingTime</tspan><tspan class="t" x="680">DATETIME · UTC</tspan></text>
  <text class="mono" y="211"><tspan class="c" x="434">venue</tspan><tspan class="t" x="680">VARCHAR(200)</tspan></text>
  <text class="mono" y="228"><tspan class="c" x="434">address</tspan><tspan class="t" x="680">VARCHAR(200) NULL</tspan></text>
  <text class="mono" y="245"><tspan class="c" x="434">venueCapacity</tspan><tspan class="t" x="680">INT UNSIGNED</tspan></text>
  <text class="mono" y="262"><tspan class="c" x="434">flyerImageUrl</tspan><tspan class="t" x="680">VARCHAR(500) NULL</tspan></text>
  <text class="mono" y="279"><tspan class="c" x="434">bankQrImageUrl</tspan><tspan class="t" x="680">VARCHAR(500) NULL</tspan></text>
  <text class="mono" y="296"><tspan class="c" x="434">whatsappNumber</tspan><tspan class="t" x="680">VARCHAR(20) NULL</tspan></text>
  <text class="mono" y="313"><tspan class="c c-ret" x="434">isActive</tspan><tspan class="t t-ret" x="680">TINYINT(1) · retired</tspan></text>
  <text class="mono" y="330"><tspan class="c" x="434">isPublished</tspan><tspan class="t" x="680">TINYINT(1)</tspan></text>
  <text class="mono" y="347"><tspan class="c" x="434">isDemo</tspan><tspan class="t" x="680">TINYINT(1)</tspan></text>
  <text class="mono" y="364"><tspan class="c" x="434">salesOpen</tspan><tspan class="t" x="680">TINYINT(1)</tspan></text>
  <text class="mono" y="381"><tspan class="k k-new" x="400">+</tspan><tspan class="c c-new" x="434">isArchived</tspan><tspan class="t t-new" x="680">TINYINT(1) · 012</tspan></text>
  <text class="mono" y="398"><tspan class="k k-new" x="400">+</tspan><tspan class="c c-new" x="434">scanKeyword</tspan><tspan class="t t-new" x="680">VARCHAR(80) NULL · 013</tspan></text>
  <text class="mono" y="415"><tspan class="c" x="434">createdAt</tspan><tspan class="t" x="680">TIMESTAMP</tspan></text>

  <!-- ─── legend (col B) ─── -->
  <rect class="box" x="390" y="640" width="300" height="120" rx="6"/>
  <text class="lg-t" x="402" y="660">LEGEND</text>
  <rect class="box-new" x="402" y="673" width="22" height="12" rx="2"/>
  <text class="lg" x="432" y="683">New in migrations 010–013</text>
  <rect class="box" x="402" y="691" width="22" height="12" rx="2"/>
  <text class="lg" x="432" y="701">Existing, live in production</text>
  <rect class="box-dim" x="402" y="709" width="22" height="12" rx="2"/>
  <text class="lg" x="432" y="719">Retired column or runner infrastructure</text>
  <path class="edge" d="M406,737 L440,737" marker-start="url(#crow)" marker-end="url(#arrow)"/>
  <text class="lg" x="452" y="740">FK: many side → referenced row</text>
  <text class="lg" x="402" y="756"><tspan class="k mono">PK FK UQ</tspan> = key types · <tspan class="k k-new mono">+</tspan> = new column (010–013)</text>

  <!-- ─── tickets (col C) ─── -->
  <rect class="box" x="760" y="48" width="300" height="395" rx="6"/>
  <text class="hdr mono" x="772" y="67">tickets</text>
  <text class="tag" x="1048" y="66">existing · +1 column in 011 · one row per seat</text>
  <line class="hd" x1="760" y1="76" x2="1060" y2="76"/>
  <text class="mono" y="92"><tspan class="k" x="770">PK</tspan><tspan class="c" x="804">id</tspan><tspan class="t" x="1050">BIGINT UNSIGNED · AI</tspan></text>
  <text class="mono" y="109"><tspan class="c" x="804">orderId</tspan><tspan class="t" x="1050">INT UNSIGNED · shared per order</tspan></text>
  <text class="mono" y="126"><tspan class="k" x="770">UQ</tspan><tspan class="c" x="804">orderAnchor</tspan><tspan class="t" x="1050">INT UNSIGNED NULL</tspan></text>
  <text class="mono" y="143"><tspan class="k" x="770">FK</tspan><tspan class="c" x="804">eventId</tspan><tspan class="t" x="1050">BIGINT UNSIGNED</tspan></text>
  <text class="mono" y="160"><tspan class="k" x="770">FK</tspan><tspan class="c" x="804">stageId</tspan><tspan class="t" x="1050">BIGINT UNSIGNED</tspan></text>
  <text class="mono" y="177"><tspan class="c" x="804">unitPrice</tspan><tspan class="t" x="1050">DECIMAL(12,2)</tspan></text>
  <text class="mono" y="194"><tspan class="c" x="804">holderName</tspan><tspan class="t" x="1050">VARCHAR(160) NULL</tspan></text>
  <text class="mono" y="211"><tspan class="c" x="804">holderIdNumber</tspan><tspan class="t" x="1050">VARCHAR(40) NULL</tspan></text>
  <text class="mono" y="228"><tspan class="c" x="804">holderPhone</tspan><tspan class="t" x="1050">VARCHAR(20) NULL</tspan></text>
  <text class="mono" y="245"><tspan class="c" x="804">deliveryMethod</tspan><tspan class="t" x="1050">ENUM(email, whatsapp)</tspan></text>
  <text class="mono" y="262"><tspan class="c" x="804">deliveryContact</tspan><tspan class="t" x="1050">VARCHAR(160)</tspan></text>
  <text class="mono" y="279"><tspan class="k k-new" x="770">+</tspan><tspan class="c c-new" x="804">preferredArtist</tspan><tspan class="t t-new" x="1050">VARCHAR(160) NULL · 011</tspan></text>
  <text class="mono" y="296"><tspan class="c" x="804">status</tspan><tspan class="t" x="1050">ENUM(pending_payment…expired)</tspan></text>
  <text class="mono" y="313"><tspan class="k" x="770">UQ</tspan><tspan class="c" x="804">idempotencyKey</tspan><tspan class="t" x="1050">CHAR(36) NULL</tspan></text>
  <text class="mono" y="330"><tspan class="c" x="804">reservationExpiresAt</tspan><tspan class="t" x="1050">DATETIME NULL</tspan></text>
  <text class="mono" y="347"><tspan class="c" x="804">createdAt</tspan><tspan class="t" x="1050">TIMESTAMP</tspan></text>
  <text class="mono" y="364"><tspan class="c" x="804">confirmedAt</tspan><tspan class="t" x="1050">DATETIME NULL</tspan></text>
  <text class="mono" y="381"><tspan class="c" x="804">confirmedBy</tspan><tspan class="t" x="1050">VARCHAR(80) NULL</tspan></text>
  <text class="mono" y="398"><tspan class="k" x="770">UQ</tspan><tspan class="c" x="804">validationHash</tspan><tspan class="t" x="1050">CHAR(64) NULL · HMAC</tspan></text>
  <text class="mono" y="415"><tspan class="c" x="804">isUsed</tspan><tspan class="t" x="1050">TINYINT(1)</tspan></text>
  <text class="mono" y="432"><tspan class="c" x="804">usedAt</tspan><tspan class="t" x="1050">DATETIME NULL</tspan></text>

  <!-- ─── ticket_stages (col C) ─── -->
  <rect class="box" x="760" y="480" width="300" height="225" rx="6"/>
  <text class="hdr mono" x="772" y="499">ticket_stages</text>
  <text class="tag" x="1048" y="498">existing · one active per event</text>
  <line class="hd" x1="760" y1="508" x2="1060" y2="508"/>
  <text class="mono" y="524"><tspan class="k" x="770">PK</tspan><tspan class="c" x="804">id</tspan><tspan class="t" x="1050">BIGINT UNSIGNED · AI</tspan></text>
  <text class="mono" y="541"><tspan class="k" x="770">FK</tspan><tspan class="c" x="804">eventId</tspan><tspan class="t" x="1050">BIGINT UNSIGNED</tspan></text>
  <text class="mono" y="558"><tspan class="c" x="804">name</tspan><tspan class="t" x="1050">VARCHAR(80)</tspan></text>
  <text class="mono" y="575"><tspan class="c" x="804">price</tspan><tspan class="t" x="1050">DECIMAL(12,2)</tspan></text>
  <text class="mono" y="592"><tspan class="c" x="804">totalQuantity</tspan><tspan class="t" x="1050">INT UNSIGNED</tspan></text>
  <text class="mono" y="609"><tspan class="c" x="804">soldQuantity</tspan><tspan class="t" x="1050">INT UNSIGNED</tspan></text>
  <text class="mono" y="626"><tspan class="c" x="804">reservedQuantity</tspan><tspan class="t" x="1050">INT UNSIGNED</tspan></text>
  <text class="mono" y="643"><tspan class="k" x="770">UQ</tspan><tspan class="c" x="804">sortOrder</tspan><tspan class="t" x="1050">SMALLINT UNSIGNED</tspan></text>
  <text class="mono" y="660"><tspan class="c" x="804">activatesAt</tspan><tspan class="t" x="1050">DATETIME NULL</tspan></text>
  <text class="mono" y="677"><tspan class="c" x="804">status</tspan><tspan class="t" x="1050">ENUM(upcoming…closed)</tspan></text>
  <text class="mono" y="694"><tspan class="k" x="770">UQ</tspan><tspan class="c" x="804">activeFlag</tspan><tspan class="t" x="1050">TINYINT · generated</tspan></text>

  <!-- ─── foreign keys ─── -->
  <!-- organizer_events.organizerId → organizers.id (NEW) -->
  <path class="edge edge-new" d="M170,255 L170,205" marker-start="url(#crow-new)" marker-end="url(#arrow-new)"/>
  <text class="lbl lbl-new" x="178" y="226">organizerId → id</text>
  <text class="lbl2" x="178" y="240">ON DELETE CASCADE</text>
  <!-- organizer_events.eventId → events.id (NEW) -->
  <path class="edge edge-new" d="M330,322 L390,322" marker-start="url(#crow-new)" marker-end="url(#arrow-new)"/>
  <text class="lbl lbl-new" x="360" y="313" text-anchor="middle">eventId → id</text>
  <text class="lbl2" x="360" y="336" text-anchor="middle">CASCADE</text>
  <!-- tickets.eventId → events.id -->
  <path class="edge" d="M750,139 L690,139" marker-start="url(#crow)" marker-end="url(#arrow)"/>
  <text class="lbl" x="720" y="130" text-anchor="middle">eventId → id</text>
  <!-- tickets.stageId → ticket_stages.id -->
  <path class="edge" d="M910,451 L910,480" marker-start="url(#crow)" marker-end="url(#arrow)"/>
  <text class="lbl" x="918" y="470">stageId → id</text>
  <!-- ticket_stages.eventId → events.id -->
  <path class="edge" d="M750,537 L600,537 L600,426" marker-start="url(#crow)" marker-end="url(#arrow)"/>
  <text class="lbl" x="608" y="505">eventId → id</text>
  <text class="lbl2" x="608" y="520">ON DELETE CASCADE</text>
  <!-- guest_passes.eventId → events.id -->
  <path class="edge" d="M330,487 L500,487 L500,426" marker-start="url(#crow)" marker-end="url(#arrow)"/>
  <text class="lbl" x="400" y="479">eventId → id</text>
  </g>
</svg>
