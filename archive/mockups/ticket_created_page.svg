  <text x="195" y="745" font-family="monospace" font-size="11" fill="#758BFD" text-anchor="middle">ID: TKT-318-1759962930490</text>
  
  <!-- Action buttons -->
  <rect x="50" y="765" width="90" height="36" rx="8" fill="#4a3d8f"/>
  <rect x="50" y="765" width="90" height="36" rx="8" fill="none" stroke="#758BFD" stroke-width="1" opacity="0.3"/>
  <text x="95" y="788" font-family="Arial, sans-serif" font-size="12" fill="#FFEDD8" text-anchor="middle">📄 Copy SVG</text>
  
  <rect x="150" y="765" width="90" height="36" rx="8" fill="#4a3d8f"/>
  <rect x="150" y="765" width="90" height="36" rx="8" fill="none" stroke="#758BFD" stroke-width="1" opacity="0.3"/>
  <text x="195" y="788" font-family="Arial, sans-serif" font-size="12" fill="#FFEDD8" text-anchor="middle">🖼️ Copy PNG</text>
  
  <rect x="250" y="765" width="90" height="36" rx="8" fill="#4a3d8f"/>
  <rect x="250" y="765" width="90" height="36" rx="8" fill="none" stroke="#758BFD" stroke-width="1" opacity="0.3"/>
  <text x="295" y="788" font-family="Arial, sans-serif" font-size="12" fill="#FFEDD8" text-anchor="middle">📤 Share</text>
  
  <!-- Create another button -->
  <rect x="50" y="655" width="290" height="44" rx="10" fill="url(#buttonGradient)"/>
  <rect x="50" y="655" width="290" height="44" rx="10" fill="none" stroke="#BEADFF" stroke-width="1" opacity="0.3"/>
  <text x="195" y="682" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFEDD8" text-anchor="middle">✨ Crear Otra Boleta</text>
</svg>