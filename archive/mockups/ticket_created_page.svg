<svg viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#27187E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#030312;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1152;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#0a0620;stop-opacity:0.95" />
    </linearGradient>
    
    <linearGradient id="buttonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#758BFD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BEADFF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main background -->
  <rect width="390" height="844" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="50" cy="700" r="80" fill="#758BFD" opacity="0.03"/>
  <circle cx="340" cy="150" r="100" fill="#BEADFF" opacity="0.04"/>
  
  <!-- Top bar -->
  <rect width="390" height="60" fill="#030312" opacity="0.95"/>
  <text x="20" y="38" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#BEADFF">Sígale</text>
  
  <!-- Burger menu icon -->
  <rect x="345" y="22" width="24" height="2" rx="1" fill="#BEADFF"/>
  <rect x="345" y="29" width="24" height="2" rx="1" fill="#BEADFF"/>
  <rect x="345" y="36" width="24" height="2" rx="1" fill="#BEADFF"/>
  
  <!-- Main card container -->
  <rect x="20" y="90" width="350" height="720" rx="24" fill="url(#cardGradient)"/>
  <rect x="20" y="90" width="350" height="720" rx="24" fill="none" stroke="#758BFD" stroke-width="1" opacity="0.2"/>
  
  <!-- Page title -->
  <text x="40" y="130" font-size="20" fill="#FF8C00">🎫</text>
  <text x="70" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFEDD8">Vender Boletas</text>
  
  <!-- Subtitle -->
  <text x="40" y="160" font-family="Arial, sans-serif" font-size="13" fill="#BEADFF" opacity="0.8">Crear y administrar ventas de boletas para su evento</text>
  
  <!-- Success section -->
  <rect x="40" y="190" width="310" height="440" rx="12" fill="#2a2a2a"/>
  <rect x="40" y="190" width="310" height="440" rx="12" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.5"/>
  
  <!-- Checkmark icon -->
  <circle cx="195" cy="230" r="24" fill="#4ade80" opacity="0.2"/>
  <text x="195" y="242" font-size="28" text-anchor="middle">✓</text>
  
  <!-- Success message -->
  <text x="195" y="285" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFEDD8" text-anchor="middle">¡Boleta Creada!</text>
  
  <text x="195" y="315" font-family="Arial, sans-serif" font-size="15" fill="#BEADFF" text-anchor="middle">Boleta para David Ram</text>
  
  <!-- Ticket details grid -->
  <text x="60" y="355" font-family="Arial, sans-serif" font-size="13" fill="#BEADFF" opacity="0.8">Tipo de Boleta</text>
  <text x="230" y="355" font-family="Arial, sans-serif" font-size="13" fill="#BEADFF" opacity="0.8">Precio</text>
  
  <text x="60" y="380" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFEDD8">preventa</text>
  <text x="230" y="380" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFEDD8">$25.000</text>
  
  <line x1="60" y1="395" x2="330" y2="395" stroke="#758BFD" stroke-width="1" opacity="0.3"/>
  
  <text x="60" y="425" font-family="Arial, sans-serif" font-size="13" fill="#BEADFF" opacity="0.8">Número de Identificación</text>
  <text x="230" y="425" font-family="Arial, sans-serif" font-size="13" fill="#BEADFF" opacity="0.8">Número de Teléfono</text>
  
  <text x="60" y="450" font-family="Arial, sans-serif" font-size="15" fill="#FFEDD8">1010241962</text>
  <text x="230" y="450" font-family="Arial, sans-serif" font-size="15" fill="#FFEDD8">3212619103</text>
  
  <!-- QR Code placeholder -->
  <rect x="115" y="475" width="160" height="160" rx="8" fill="#FFFFFF"/>
  <rect x="120" y="480" width="150" height="150" rx="4" fill="#000000"/>
  
  <!-- QR pattern simulation -->
  <rect x="125" y="485" width="20" height="20" fill="#FFFFFF"/>
  <rect x="155" y="485" width="10" height="10" fill="#FFFFFF"/>
  <rect x="175" y="485" width="20" height="20" fill="#FFFFFF"/>
  <rect x="205" y="485" width="20" height="20" fill="#FFFFFF"/>
  <rect x="235" y="485" width="20" height="20" fill="#FFFFFF"/>
  
  <rect x="125" y="515" width="10" height="10" fill="#FFFFFF"/>
  <rect x="145" y="515" width="10" height="10" fill="#FFFFFF"/>
  <rect x="165" y="525" width="15" height="15" fill="#FFFFFF"/>
  <rect x="195" y="515" width="10" height="10" fill="#FFFFFF"/>
  
  <rect x="125" y="555" width="15" height="15" fill="#FFFFFF"/>
  <rect x="155" y="545" width="20" height="20" fill="#FFFFFF"/>
  <rect x="185" y="555" width="10" height="10" fill="#FFFFFF"/>
  <rect x="215" y="545" width="15" height="15" fill="#FFFFFF"/>
  
  <rect x="125" y="585" width="20" height="20" fill="#FFFFFF"/>
  <rect x="155" y="595" width="10" height="10" fill="#FFFFFF"/>
  <rect x="185" y="585" width="15" height="15" fill="#FFFFFF"/>
  <rect x="215" y="595" width="10" height="10" fill="#FFFFFF"/>
  <rect x="235" y="585" width="20" height="20" fill="#FFFFFF"/>
  
  <rect x="125" y="615" width="20" height="20" fill="#FFFFFF"/>
  <rect x="175" y="615" width="15" height="15" fill="#FFFFFF"/>
  <rect x="205" y="615" width="20" height="20" fill="#FFFFFF"/>
  <rect x="235" y="615" width="20" height="20" fill="#FFFFFF"/>
  
  <!-- Event details section -->
  <text x="195" y="665" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFEDD8" text-anchor="middle">Prueba 2</text>
  
  <text x="195" y="690" font-family="Arial, sans-serif" font-size="13" fill="#BEADFF" text-anchor="middle">📅 2025-10-09  •  🕐 17:33</text>
  
